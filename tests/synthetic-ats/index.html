<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Synthetic ATS · safe test only</title><style>body{font:16px system-ui;max-width:700px;margin:40px auto;padding:20px;background:#fff9ef;color:#29231d}form{border:1px solid #ddc9aa;padding:20px;margin:20px 0;border-radius:12px;background:white}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:9px;display:block;width:100%;max-width:420px}button{background:#ed6a2c;color:white;border:0;margin-top:14px;cursor:pointer}.warning{background:#ffdfbd;padding:14px;border-radius:8px}</style></head><body><h1>Synthetic application form</h1><p class="warning"><strong>Test site only.</strong> Use synthetic identity and CV data. Nothing is stored or sent to an employer.</p><p>Role: Synthetic Machine Learning Engineer · Test City</p><form id="application" method="post" action="/api/submit" enctype="multipart/form-data"><h2>Candidate application</h2><label>Full name<input name="name" required value="Synthetic Candidate"></label><label>Email<input name="email" type="email" required value="synthetic@example.com"></label><label>Skills<textarea name="skills" required>Python, SQL, testing</textarea></label><label>CV (synthetic text only)<input name="cv" type="file" required></label><button type="submit">Review and submit synthetic application</button></form><form id="json-application"><h2>JSON application variant</h2><label>Full name<input name="name" required value="Synthetic JSON Candidate"></label><label>Email<input name="email" type="email" required value="json@example.com"></label><button id="json-submit" type="button">Submit synthetic JSON application</button></form><p id="result" role="status"></p><script>document.getElementById('json-submit').addEventListener('click',async()=>{const form=document.getElementById('json-application');if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form).entries());const response=await fetch('/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});document.getElementById('result').textContent=response.ok?'Synthetic JSON submission confirmed':'Submission failed';});</script></body></html>
